<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found · TR2UK Digital Solutions</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">

<!--
  The site was seven pages until 20 August 2026 and is one from that day on.
  Anything still linking to /consulting/, /digital-solutions/, /publishing/,
  /fire-safety/, /food-hygiene/, /contact/ or /blog/ lands here.

  ⚠ It exists because the alternative is GitHub's own 404, which is a grey
  page carrying somebody else's branding on our domain. This one says what
  happened in a sentence and hands the reader the door.
-->
<style>
  :root{ --primary:#0a192f; --accent:#64ffda; --paper:#FFFFFF; --muted:#94A3B8;
         --font:'Bai Jamjuree',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
  *{box-sizing:border-box}
  body{margin:0; min-block-size:100dvh; display:grid; place-items:center;
       background:var(--primary); color:var(--paper); font-family:var(--font);
       line-height:1.6; padding-inline:24px; text-align:center;}
  .code{font-size:12px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; color:var(--accent); margin:0}
  h1{font-size:clamp(26px,5vw,38px); font-weight:700; margin:14px 0 0; line-height:1.2}
  p{margin:14px auto 0; max-inline-size:34rem; color:var(--muted); font-size:15px}
  a.home{display:inline-block; margin-block-start:28px; padding:12px 26px; border-radius:999px;
         background:var(--accent); color:var(--primary); font-weight:700; text-decoration:none; font-size:15px}
  a.home:hover{opacity:.9}
  .mark{margin-block-start:34px; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:rgba(148,163,184,.7)}
</style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>That page is not here any more.</h1>
    <p>
      This site was reorganised on 20 August 2026 and now lives on a single page.
      Whatever you were looking for is most likely on it, or one link away from it.
    </p>
    <a class="home" href="/">Go to TR2UK Digital Solutions</a>
    <p class="mark">TR2UK Digital Solutions</p>
  </main>
</body>
</html>
