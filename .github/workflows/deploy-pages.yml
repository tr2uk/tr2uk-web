name: Deploy to GitHub Pages

# tr2uk.com is one static page now, so there is nothing to build.
#
# ⛔ PAGES SERVES THE BRANCH ROOT ON THIS REPOSITORY, NOT THIS WORKFLOW'S
# ARTIFACT. The Pages settings are the legacy kind - build_type "legacy",
# source main at "/" - so whatever sits at the top of main IS the website and
# an Actions artifact is ignored. Learned the hard way on 20 August: the site
# was first published into a site/ subfolder, this workflow went green, and
# tr2uk.com answered GitHub's own 404 while tr2uk.com/site/index.html served
# perfectly. So the page lives at the root and this workflow uploads the root
# too, which keeps both mechanisms saying the same thing if the setting is
# ever switched to "GitHub Actions".
#
# ⛔ CNAME IS LOAD-BEARING. It is what holds the custom domain. A tree without
# it points tr2uk.com at nothing, behind a perfectly green build. .nojekyll is
# the other one: without it Pages runs Jekyll over the output and drops
# anything beginning with an underscore.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages and use OIDC for verification.
permissions:
  contents: read
  pages: write
  id-token: write

# Serialise Pages deployments; do not cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # ⚠ Fail here rather than deploy a site with no domain and no index.
      - name: Check what is about to be published
        run: |
          test -f index.html || { echo "index.html is missing from the repo root"; exit 1; }
          test -f CNAME      || { echo "CNAME is missing - tr2uk.com would stop resolving"; exit 1; }
          echo "publishing $(du -sh . --exclude=.git | cut -f1) from the repository root"
          echo "domain: $(cat CNAME)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
